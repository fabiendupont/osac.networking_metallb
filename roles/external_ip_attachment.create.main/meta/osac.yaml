resource_type: ExternalIPAttachment
event: Create
phase: main
priority: 100
failure_policy: Fail

parameters:
  - name: external_ip
    type: dict
    required: true
    description: >-
      ExternalIP Kubernetes resource with spec.computeInstance set and annotations
      osac.openshift.io/externalippool-name and
      osac.openshift.io/externalip-target-namespace

outputs:
  - name: attach_ip_address
    type: string
    description: IP address attached to the ComputeInstance
