resource_type: PublicIPAttachment
event: Create
phase: main
priority: 100
failure_policy: Fail

parameters:
  - name: public_ip
    type: dict
    required: true
    description: >-
      PublicIP Kubernetes resource with spec.computeInstance set and annotations
      osac.openshift.io/publicippool-name and
      osac.openshift.io/publicip-target-namespace

outputs:
  - name: attach_ip_address
    type: string
    description: IP address attached to the ComputeInstance
